[package]
name = "ironvale"
version = "0.1.1"
description = "Ironvale, a first-person shooter"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = ["codegen"] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSCursor", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString"] }

[features]
# Answers WebKit's own Pointer Lock request through a private WKUIDelegate
# selector instead of grabbing the cursor. Off: the public-API cursor grab is
# used. See docs/research/tech.json, notes section 2, option B.
webkit-pointer-lock = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Procedural macros are libraries the compiler loads while it builds. Stripped by
# Xcode 27's `strip` they no longer load ("mis-aligned LINKEDIT string pool") and
# every release build fails with "can't find crate". Only the app itself is stripped.
[profile.release.build-override]
strip = false
