# Source of truth for IronvaleApp.xcodeproj (generated, git-ignored). Regenerate with:
#   cd native/IronvaleApp && xcodegen generate
name: IronvaleApp
options:
  bundleIdPrefix: dev.n3el
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
packages:
  IronvaleKit:
    path: ../IronvaleKit
targets:
  Ironvale:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shaders
      - path: Resources
        excludes:
          - Info.plist
          - Ironvale.entitlements
          # Copied by the "Stage runtime data" phase into Contents/Resources/Licenses.
          - Licenses
    dependencies:
      - package: IronvaleKit
        product: IronvaleKit
    settings:
      base:
        PRODUCT_NAME: Ironvale
        PRODUCT_BUNDLE_IDENTIFIER: dev.n3el.ironvale
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Ironvale.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        # Off while builds are ad-hoc signed: library validation rejects the
        # Google-signed WebRTC.framework. M12 turns it on with Developer ID signing.
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        # Shaders include ShaderTypes.h from the package's C target.
        MTL_HEADER_SEARCH_PATHS: $(SRCROOT)/../IronvaleKit/Sources/ShaderTypes/include
        MTL_LANGUAGE_REVISION: Metal32
        # Version numbering (Info.plist reads these). build-app.sh sets CURRENT_PROJECT_VERSION from
        # BUILD_NUMBER for release builds; bump MARKETING_VERSION per release (docs/native-port/RELEASE.md).
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # The "Stage runtime data" phase reads the repository (map packages, assets) at build time.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          # No Ironvale.debug.dylib / __preview.dylib in a shipped build.
          ENABLE_DEBUG_DYLIB: NO
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    postBuildScripts:
      # Everything the app opens at run time goes into Contents/Resources (Contract/, Runtime/, Licenses/),
      # so the app never reads the source tree (native/ci/stage-runtime.py; checked by check-m12-prep.sh).
      - name: Stage runtime data
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          /usr/bin/python3 "$SRCROOT/../ci/stage-runtime.py" "$SRCROOT/../.." "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
schemes:
  Ironvale:
    build:
      targets:
        Ironvale: all
    run:
      config: Debug
    archive:
      config: Release
